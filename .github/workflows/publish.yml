name: Publish Gotham Noir Extension

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Pillow
        run: pip install pillow
      - name: Build & verify
        run: |
          python3 scripts/build.py
          python3 -m unittest discover -s tests -v
      - name: Package VSIX
        working-directory: packages/vscode
        run: npx --yes @vscode/vsce package -o gotham-noir.vsix
      - name: Publish to VS Code Marketplace
        working-directory: packages/vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -n "$VSCE_PAT" ]; then
            npx --yes @vscode/vsce publish --packagePath gotham-noir.vsix
          else
            echo "Skipping VS Code Marketplace publish (VSCE_PAT not set)."
          fi
      - name: Publish to Open VSX Registry
        working-directory: packages/vscode
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -n "$OVSX_PAT" ]; then
            npx --yes ovsx publish gotham-noir.vsix
          else
            echo "Skipping Open VSX publish (OVSX_PAT not set)."
          fi
