name: Validate Gotham Noir

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Pillow & zsh
        run: |
          pip install pillow
          sudo apt-get update && sudo apt-get install -y zsh
      - name: Build SSOT targets & verify WCAG/APCA contrast
        run: python3 scripts/build.py
      - name: Validate shell scripts
        run: |
          bash -n ports/macos-terminal/apply-macos-terminal.sh
          zsh -n ports/zsh/gotham-noir-zsh.zsh
      - name: Package VS Code / Open VSX VSIX
        working-directory: packages/vscode
        run: npx --yes @vscode/vsce package -o gotham-noir-1.0.0.vsix && npx --yes @vscode/vsce ls
      - name: Run full E2E unit test suite
        run: python3 -m unittest discover -s tests -v
      - name: Ensure generated text outputs have no uncommitted drift
        run: git diff --exit-code -- . ':(exclude)*.png'

  validate-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: pip install pillow
      - name: Validate macOS Terminal.app plists & NSKeyedArchiver blobs via AppKit
        run: |
          plutil -lint ports/macos-terminal/*.terminal
          bash -n ports/macos-terminal/apply-macos-terminal.sh
          python3 -m unittest tests.test_themes.GothamNoirTests.test_macos_terminal_appkit_roundtrip -v

  validate-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell scripts and test Windows Terminal installer + PSReadLine
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($file in @("ports/windows-terminal/install-windows-terminal.ps1", "ports/windows-terminal/gotham-noir-psreadline.ps1")) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              throw "PowerShell parse errors in ${file}: $($errors | Out-String)"
            }
          }

          $psrColors = & ./ports/windows-terminal/gotham-noir-psreadline.ps1 -Variant batcomputer -PassThru
          if ($psrColors["Command"] -ne "#72b4f5") {
            throw "Unexpected Batcomputer PSReadLine Command color: $($psrColors['Command'])"
          }
          if (-not $psrColors["Selection"].StartsWith("$([char]27)[48;2;")) {
            throw "Expected ANSI background escape for PSReadLine Selection, got: $($psrColors['Selection'])"
          }

          $mockSettings = Join-Path $env:RUNNER_TEMP "wt-settings.json"
          $mockFragment = Join-Path $env:RUNNER_TEMP "wt-fragments"
          $jsoncInput = (@(
            '// User comment with URL https://aka.ms/terminal-profiles-schema',
            '{',
            '  "$schema": "https://aka.ms/terminal-profiles-schema",',
            '  /* Multi-line JSONC comment',
            '     preserving custom schemes and paths */',
            '  "schemes": [',
            '    { "name": "José Custom", "background": "#111111" }',
            '  ],',
            '  "profiles": {',
            '    "defaults": {',
            '      "icon": "C:\\Users\\José\\icon.png"',
            '    }',
            '  }',
            '}'
          ) -join "`n")
          [System.IO.File]::WriteAllText($mockSettings, $jsoncInput, [System.Text.UTF8Encoding]::new($false))

          & ./ports/windows-terminal/install-windows-terminal.ps1 -Variant "Batcomputer" -SettingsPath $mockSettings -FragmentDir $mockFragment

          if (-not (Test-Path "$mockSettings.bak")) { throw "Missing settings backup" }
          $updated = [System.IO.File]::ReadAllText($mockSettings, [System.Text.UTF8Encoding]::new($false)) | ConvertFrom-Json
          if ($updated.schemes.Count -ne 5) { throw "Expected 5 schemes (1 custom + 4 Gotham Noir), got $($updated.schemes.Count)" }
          if (-not ($updated.schemes | Where-Object { $_.name -eq "José Custom" })) { throw "Lost UTF-8 custom scheme José Custom" }
          if ($updated.profiles.defaults.icon -ne "C:\Users\José\icon.png") { throw "Lost UTF-8 profile icon path: $($updated.profiles.defaults.icon)" }
          if ($updated.profiles.defaults.colorScheme -ne "Gotham Noir - Batcomputer") {
            throw "Expected Gotham Noir - Batcomputer default scheme, got $($updated.profiles.defaults.colorScheme)"
          }
          $frag = [System.IO.File]::ReadAllText((Join-Path $mockFragment "themes.json"), [System.Text.UTF8Encoding]::new($false)) | ConvertFrom-Json
          if ($frag.schemes.Count -ne 4) { throw "Expected 4 fragment schemes, got $($frag.schemes.Count)" }

          $emptyBomSettings = Join-Path $env:RUNNER_TEMP "wt-empty-bom.json"
          [System.IO.File]::WriteAllBytes($emptyBomSettings, [byte[]]@(0xEF, 0xBB, 0xBF))
          & ./ports/windows-terminal/install-windows-terminal.ps1 -Variant "Year One" -SettingsPath $emptyBomSettings -SkipFragment
          $emptyUpdated = [System.IO.File]::ReadAllText($emptyBomSettings, [System.Text.UTF8Encoding]::new($false)) | ConvertFrom-Json
          if ($emptyUpdated.schemes.Count -ne 4) { throw "Expected 4 schemes on empty BOM settings fallback, got $($emptyUpdated.schemes.Count)" }
          Write-Host "Windows Terminal & PowerShell verification passed"
