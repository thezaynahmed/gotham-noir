# tmux Config - Gotham Noir (Dyslexia + ADHD + Late-Night Edition)
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
set -g focus-events on
set -ga terminal-overrides ',*:Ss=\E[2 q:Se=\E[2 q'
# Gotham Noir - Year One (YEAR-ONE // DETECTIVE-27) - tmux theme
setw -g window-style 'fg=#878d96,bg=#101214'
setw -g window-active-style 'fg=#d8d6cf,bg=#15171a'
set -g pane-border-style 'fg=#23272f'
set -g pane-active-border-style 'fg=#f0c946'
set -g history-limit 10000
